# Serves the built SPA and proxies /api to the backend service on the
# compose network, mirroring the dev-server proxy in vite.config.ts.
server {
    listen 80;

    # Security headers for the pages nginx serves. These mirror the API's
    # helmet headers (backend/src/security.ts). The CSP fits the Vite build:
    # one same-origin module bundle, a same-origin stylesheet, no inline script
    # or style, and the API reached through this same origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Lets the backend's per-IP import limiter see the real client rather
        # than this proxy's address (the backend trusts one hop).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
